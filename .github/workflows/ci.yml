name: CI

# Tests the Worker and builds the website on every pull request and on pushes to feature branches.
on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check no secrets are committed
        run: node scripts/check-secrets.mjs
      - name: Check the engine copy of shared code is in sync
        run: node scripts/sync-engine-shared.mjs --check
      - name: Tests (relay, engine + MCP, crypto, scheduler, SEO, daily limits)
        run: npm test
      - name: Build website
        run: npm run build
      - name: Check the relay bundles
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build --config worker/wrangler.toml
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Check the user engine bundles
        run: npx -y wrangler@4 deploy --dry-run --outdir /tmp/engine-build --config engine/wrangler.toml
        env:
          WRANGLER_SEND_METRICS: 'false'
